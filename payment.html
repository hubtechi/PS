<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment</title>

<style>

body{
    background:#111;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}
    

.container{
    background:#222;
    padding:30px;
    border-radius:15px;
    width:350px;
}

input{
    width:100%;
    padding:15px;
    margin:15px 0;
    border:none;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    background:#00ff88;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

.network{
    display:flex;
    justify-content:center;
    gap:40px;
    margin:20px 0;
}

.network label{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:18px;
}

.network input{
    width:auto;
}


</style>

</head>

<body>

<div class="container">

<h2>Confirm Purchase</h2>

<p><strong>Package:</strong> <span id="package"></span></p>

<p><strong>Price:</strong> UGX <span id="price"></span></p>

<input
type="tel"
id="phone"
placeholder="Enter MTN or Airtel Number">

<h3>Select Network</h3>

<div class="network">

<label>
<input type="radio" name="network" value="MTN" checked>
<span>MTN</span>
</label>

<label>
<input type="radio" name="network" value="Airtel">
<span>Airtel</span>
</label>

</div>

<br><br>

<button onclick="payNow()">
Pay Now
</button>

</div>

<script>
window.onload = function(){

    let packageName = localStorage.getItem("package");
    let price = localStorage.getItem("price");

    document.getElementById("package").innerText = packageName;
    document.getElementById("price").innerText = price;

    }

function payNow(packageName, price){

    document.getElementById("paymentModal").style.display = "block";

    document.getElementById("selectedPackage").innerText = packageName;

    document.getElementById("selectedPrice").innerText = "UGX " + price;

}

function payNow(){

let phone = document.getElementById("phone").value;

if(phone==""){
    alert("Enter your phone number.");
    return;
}

let network = document.querySelector('input[name="network"]:checked').value;

let packageName = localStorage.getItem("package");
let price = localStorage.getItem("price");


document.querySelector(".container").innerHTML = `

<h2>Payment Request</h2>

<p>Package: <b>${packageName}</b></p>

<p>Amount: <b>UGX ${price}</b></p>

<p>Phone: <b>${phone}</b></p>

<p>Network: <b>${network}</b></p>

<br>

<h3>Waiting for payment confirmation...</h3>

`;

    }

</script>

</body>

</html>
