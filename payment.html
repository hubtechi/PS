<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment</title>

<style>

body{
    background:#111;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}
    

.container{
    background:#222;
    padding:30px;
    border-radius:15px;
    width:350px;
}

input{
    width:100%;
    padding:15px;
    margin:15px 0;
    border:none;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    background:#00ff88;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h2>Confirm Purchase</h2>

<p><strong>Package:</strong> <span id="package"></span></p>

<p><strong>Price:</strong> UGX <span id="price"></span></p>

<input
type="tel"
id="phone"
placeholder="Enter MTN or Airtel Number">

<h3>Select Network</h3>

<div class="network">

<label>
<input type="radio" name="network" value="MTN" checked>
<span>MTN</span>
</label>

<label>
<input type="radio" name="network" value="Airtel">
<span>Airtel</span>
</label>

</div>

<br><br>

<button onclick="payNow()">
Pay Now
</button>

</div>

<script>

document.getElementById("package").innerHTML =
localStorage.getItem("package");

document.getElementById("price").innerHTML =
localStorage.getItem("price");

function payNow(){

let phone = document.getElementById("phone").value;

if(phone==""){
    alert("Enter your phone number.");
    return;
}

let network =
document.querySelector('input[name="network"]:checked').value;

let packageName = localStorage.getItem("package");
let price = localStorage.getItem("price");

alert(

"Payment Request\n\n"+

"Package: "+packageName+

"\nPrice: UGX "+price+

"\nPhone: "+phone+

"\nNetwork: "+network+

"\n\nIn the next lesson this information will be sent to the payment server."

);

    }

alert(
"Payment request would now be sent to:\n"+
phone
);

}

</script>

</body>

</html>
